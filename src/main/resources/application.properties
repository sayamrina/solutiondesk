spring.application.name=solutiondesk
server.port=${PORT:8090}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:h2:mem:solutiondesk-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=300KB
server.tomcat.max-swallow-size=2MB
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
solutiondesk.slow-request-ms=800
solutiondesk.timezone=Europe/Berlin
solutiondesk.sample-traffic=true
