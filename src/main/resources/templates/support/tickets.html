<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Tickets')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('tickets')}"></header>
<main class="wrap">
  <div class="row spread">
    <div><h1>Tickets</h1><p class="lead" style="margin-bottom:8px">Priority follows impact × urgency. First response targets: P1 1 h, P2 4 h, P3 8 h, P4 24 h.</p></div>
    <div class="row">
      <a class="btn ghost small" href="/support/tickets/export.csv">Export for Jira (CSV)</a>
      <a class="btn small" href="/support/tickets/new">New ticket</a>
    </div>
  </div>
  <form method="get" action="/support/tickets" class="row filters" style="margin:6px 0 14px">
    <select name="view" aria-label="View">
      <option value="open" th:selected="${view == 'open'}">Open</option>
      <option value="closed" th:selected="${view == 'closed'}">Resolved and closed</option>
      <option value="all" th:selected="${view == 'all'}">All</option>
    </select>
    <select name="priority" aria-label="Priority"><option value="">All priorities</option>
      <option th:each="p : ${ {'P1','P2','P3','P4'} }" th:value="${p}" th:selected="${p == priority}" th:text="${p}">P1</option></select>
    <select name="customer" aria-label="Customer"><option value="">All customers</option>
      <option th:each="c : ${customers}" th:value="${c['ID']}" th:selected="${customer != null and c['ID'] == customer}" th:text="${c['NAME']}">c</option></select>
    <input name="q" th:value="${q}" placeholder="Search key, text or error code" aria-label="Search" style="min-width:240px">
    <button class="btn small">Filter</button>
    <a class="small" href="/support/tickets" th:if="${q != null or priority != null or customer != null}">Reset</a>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Key</th><th>Priority</th><th>Summary</th><th>Customer</th><th>Error code</th><th>Status</th><th>Team</th><th>First response</th><th>Updated</th></tr></thead>
      <tbody>
      <tr th:each="r : ${rows}" th:with="t=${r.ticket()}">
        <td><a class="mono" th:href="@{/support/tickets/{k}(k=${t.key()})}" th:text="${t.key()}">SD-1</a></td>
        <td><span th:replace="~{fragments/layout :: prio(${t.priority()})}"></span></td>
        <td><a th:href="@{/support/tickets/{k}(k=${t.key()})}" th:text="${t.summary()}" style="color:inherit;text-decoration:none">summary</a></td>
        <td th:text="${t.customerName()}">customer</td>
        <td><span class="tag" th:if="${t.errorCode() != null}" th:text="${t.errorCode()}">code</span></td>
        <td><span th:replace="~{fragments/layout :: status(${t.status()})}"></span></td>
        <td><span class="tag team" th:text="${t.team()}">Support</span></td>
        <td><span th:replace="~{fragments/layout :: sla(${r.sla()})}"></span></td>
        <td class="small muted" th:text="${@fmt.ago(t.updatedAt())}">ago</td>
      </tr>
      <tr th:if="${rows.isEmpty()}"><td colspan="9" class="muted">No tickets match these filters.</td></tr>
      </tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
