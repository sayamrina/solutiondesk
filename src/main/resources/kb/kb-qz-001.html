<article data-code="SD-QZ-001" data-title="Quiz submitted without an enrollment" data-summary="The learner is not enrolled in the course, so there is nowhere to store the result.">
<h2>Cause</h2>
<p>The learner opened the quiz through an old link or a colleague's bookmark, but has no enrollment for the course.</p>
<h2>Solution</h2>
<p>Ask the customer's training coordinator to enroll the learner. Then the learner takes the quiz again.</p>
</article>
